name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Pinned (not @main) so a change upstream can't move this onto a paid runner: MK Matrix's
    # GitHub use must cost nothing. Checked at this commit: standard ubuntu runners only.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@bb16e4122aea92d09106f2bdea1655f06a07711f
    secrets: inherit
