    </g>
    <g fill="none" stroke="#e08a5f" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 330) skewX(-12) translate(0 -330)">
      <ellipse cx="236" cy="262" rx="54" ry="68"/>
      <path d="M296 190 V302 Q296 330 322 330"/>
    </g>
  </g>
</svg>
